[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Historical unused imports kept as-is (csv at :19, numpy at :11);
# delete the imports instead once someone touches those files.
"experiments/xgboost_baseline.py" = ["F401"]
"scripts/01alt_download_bace.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test (the suite is designed to stay fast; deselect with -m 'not slow')",
]
