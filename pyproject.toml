[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Historical unused import kept as-is (numpy at :11);
# delete the import instead once someone touches that file.
"scripts/01alt_download_bace.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test (the suite is designed to stay fast; deselect with -m 'not slow')",
]
